<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Story Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>✨ AI Story Generator</h1>

        <div class="glass-card">
            <textarea id="prompt" placeholder="Enter your story prompt..."></textarea>
            <button id="generateBtn">Generate Story</button>
        </div>

        <div class="glass-card output-card">
            <h2>Generated Story</h2>
            <div id="storyOutput">Your story will appear here...</div>
        </div>

        <div class="hexagon-container">
            <div class="hexagon">
                <span>🚀</span>
            </div>
            <div class="hexagon">
                <span>📚</span>
            </div>
            <div class="hexagon">
                <span>🌟</span>
            </div>
        </div>
    </div>

    
</body>

</html>
